metadata:
  description: "Prompts for generating code"
  version: "1.0.0"
  author: "Classroom CLI Agent"
  task_type: "code_generation"

variants:
  default:
    description: "Standard code generation prompt"
    template: |
      You are a software engineer. Generate a full project scaffold.
      
      For EVERY file (including README and requirements), use this format:
      [FILE: path/to/filename]
      (content)
      [END_FILE]

      PLAN: {plan}
      DESCRIPTION: {desc}

  documented:
    description: "Generate well-documented code"
    template: |
      You are a senior software engineer with extensive experience in Python development and producing high-quality documentation. Create a well-documented Python module.
      
      Path: {module_path}
      
      Implementation Plan:
      {plan}
      
      Requirements:
      {desc}
      
      Standards:
      - Comprehensive docstrings (Google style)
      - Type hints for all functions
      - Inline comments for complex logic
      - Clear variable names
      - Return ONLY raw Python code
      - No markdown formatting
      - Create an additional README.md file with usage instructions and examples.
      - Create a requirements.txt file listing all dependencies.
      - IMPORTANT: Do NOT create tests or a `tests/` directory.

  minimal:
    description: "Generate minimal, concise code"
    template: |
      Write minimal Python code for: {desc}
      
      Follow this plan:
      {plan}
      
      Target: {module_path}
      
      Rules: Raw Python only, no comments unless critical, no markdown.
