[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator-app"
version = "0.1.0"
description = "A simple command-line calculator"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/calculator-app"
"Bug Tracker" = "https://github.com/yourusername/calculator-app/issues"

[tool.setuptools]
packages = ["src"]
